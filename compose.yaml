name: kairos

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KAIROS_DB_NAME:-kairos}
      POSTGRES_USER: ${KAIROS_DB_USER:-kairos}
      POSTGRES_PASSWORD: ${KAIROS_DB_PASSWORD:?Copy .env.example to .env and set KAIROS_DB_PASSWORD}
    ports:
      - "${KAIROS_DB_PORT:-5432}:5432"
    volumes:
      - kairos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Kairos: Host=database;Port=5432;Database=${KAIROS_DB_NAME:-kairos};Username=${KAIROS_DB_USER:-kairos};Password=${KAIROS_DB_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      Authentication__Authority: http://localhost:${KAIROS_KEYCLOAK_PORT:-8081}/realms/kairos
      Authentication__Audience: kairos-api
      Authentication__ValidIssuer: http://localhost:${KAIROS_KEYCLOAK_PORT:-8081}/realms/kairos
      Authentication__BackchannelAuthority: http://keycloak:8080
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "${KAIROS_API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://localhost:${KAIROS_KEYCLOAK_PORT:-8081}
        VITE_KEYCLOAK_REALM: kairos
        VITE_KEYCLOAK_CLIENT_ID: kairos-web
        VITE_GOOGLE_LOGIN_ENABLED: ${KAIROS_GOOGLE_LOGIN_ENABLED:-false}
    ports:
      - "${KAIROS_WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KAIROS_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KAIROS_KEYCLOAK_ADMIN_PASSWORD:?Set KAIROS_KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KAIROS_KEYCLOAK_PORT:-8081}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
    ports:
      - "${KAIROS_KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - kairos-keycloak-data:/opt/keycloak/data
      - ./infrastructure/keycloak/kairos-realm.json:/opt/keycloak/data/import/kairos-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

volumes:
  kairos-postgres-data:
  kairos-keycloak-data:
